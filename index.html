      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Mazen Alkhadami | Web &amp; Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"

    <style>
      :root {
        --bg: #101820;
        --surface: #1d3444;
        --text: #f1f4f6;
        --muted: #82939e;
        --mint: #42d6b0;
        --mint-text: #42d6b0;
        --on-mint: #101820;
        --line: rgba(130, 147, 158, 0.28);
        --radius: 14px;
        --font: "Manrope", "Cairo", system-ui, sans-serif;
      }
      :root[data-theme="light"] {
        --bg: #f1f4f6;
        --surface: #fff;
        --text: #101820;
        --muted: #4f6370;
        --mint-text: #0b7d63;
        --line: rgba(16, 24, 32, 0.15);
      }
      :root[lang="ar"] {
        --font: "Cairo", "Manrope", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 76px;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.7;
        transition:
          background 0.3s,
          color 0.3s;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 3px solid var(--mint);
        outline-offset: 3px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 20px;
      }
      section {
        padding: 72px 0;
      }
      h2 {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        font-weight: 800;
        margin-bottom: 8px;
      }
      .sub {
        color: var(--muted);
        margin-bottom: 32px;
        max-width: 60ch;
      }
      .mint {
        background: var(--mint);
        color: var(--on-mint);
        padding: 0 0.18em;
        border-radius: 8px;
      }
      /* header */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
      }
      .pill {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 10px 14px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
      }
      .logo {
        font-weight: 800;
        font-size: 1.1rem;
        direction: ltr;
      }
      .logo b {
        color: var(--mint-text);
      }
      nav {
        display: flex;
        gap: 2px;
      }
      nav a {
        padding: 8px 14px;
        border-radius: 12px;
        color: var(--muted);
        font-weight: 600;
        font-size: 0.92rem;
        white-space: nowrap;
        transition: 0.2s;
      }
      nav a:hover {
        color: var(--text);
        background: color-mix(in srgb, var(--text) 7%, transparent);
      }
      nav a.on {
        background: var(--mint);
        color: var(--on-mint);
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .ib {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 999px;
        height: 44px;
        min-width: 44px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 600 0.95rem var(--font);
        cursor: pointer;
        transition: 0.2s;
      }
      .ib:hover {
        border-color: var(--mint);
      }
      .ib svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ib.th,
      #burger {
        padding: 0;
        width: 44px;
      }
      #burger {
        display: none;
      }
      .rq2 {
        display: none;
      }
      @media (max-width: 900px) {
        nav {
          display: none;
          position: absolute;
          top: calc(100% + 8px);
          inset-inline: 0;
          flex-direction: column;
          background: var(--surface);
          border: 1px solid var(--line);
          border-radius: 18px;
          padding: 10px;
          box-shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
        }
        nav.open {
          display: flex;
        }
        nav a {
          padding: 12px 16px;
        }
        #burger {
          display: inline-flex;
        }
        .rq2 {
          display: inline-flex;
          justify-content: center;
          margin-top: 6px;
        }
      }
      @media (max-width: 640px) {
        .pill {
          padding: 8px 10px;
        }
      }
      [hidden] {
        display: none !important;
      }
      .ic2 {
        width: 18px;
        height: 18px;
        flex: none;
        fill: currentColor;
      }
      .btn .ic2 {
        margin-inline-end: 0;
      }
      .soc a,
      .links a {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
      .links a {
        display: flex;
      }
      .marq {
        overflow: hidden;
        direction: ltr;
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent,
          #000 8%,
          #000 92%,
          transparent
        );
        mask-image: linear-gradient(
          90deg,
          transparent,
          #000 8%,
          #000 92%,
          transparent
        );
      }
      .mtrack {
        display: flex;
        width: max-content;
        animation: mq 32s linear infinite;
      }
      .marq:hover .mtrack {
        animation-play-state: paused;
      }
      @keyframes mq {
        to {
          transform: translateX(-50%);
        }
      }
      .tt {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        min-width: 108px;
        padding: 16px 12px;
        margin-right: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        font-weight: 700;
        font-size: 0.85rem;
      }
      .tt img {
        width: 46px;
        height: 46px;
        background: #f1f4f6;
        border-radius: 10px;
        padding: 6px;
      }
      .gd .thumb {
        height: 200px;
      }
      .cr {
        margin-bottom: 52px;
        text-align: center;
      }
      .crt {
        font-size: 1.5rem;
        font-weight: 800;
      }
      .crt::after {
        content: "";
        display: block;
        width: 70px;
        height: 4px;
        border-radius: 4px;
        background: var(--mint);
        margin: 10px auto 0;
      }
      .crb {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        direction: ltr;
        max-width: 640px;
        margin: 26px auto 0;
      }
      .ar {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
      }
      .ar:hover {
        border-color: var(--mint);
      }
      .cs {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .si {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        transition: 0.3s;
      }
      .lg2 {
        display: grid;
        place-items: center;
        background: #f1f4f6;
        border: 1px solid var(--line);
      }
      .si.side {
        opacity: 0.38;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .si.side .lg2 {
        width: 58px;
        height: 58px;
        border-radius: 16px;
      }
      .si.side img {
        width: 32px;
      }
      .si.main .lg2 {
        width: 132px;
        height: 132px;
        border-radius: 30px;
        border: 3px solid var(--mint);
        box-shadow: 0 14px 40px rgba(66, 214, 176, 0.25);

      .si.main img {
        width: 70px;

      .cbd {
        font-size: 1.6rem;
        font-weight: 800;
        color: #101820;
      }
      .nm {
        font-size: 1.35rem;
        font-weight: 800;
        margin-top: 14px;
        direction: ltr;

      .dots {

        gap: 8px;
        justify-content: center;
        margin-top: 14px;

      .dots i {
        width: 12px;
        height: 12px;

        background: var(--line);
        transition: 0.3s;
        cursor: pointer;
      }
      .dots i.on {
        width: 44px;
        background: var(--mint);
      }

        .si.side img {

        }

        text-align: center;

      .fcard {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 34px 24px 20px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      }
      .fgrid {
        justify-items: center;
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 30px;
        padding-bottom: 26px;
      }
      .fgrid h4 {
        margin-bottom: 10px;
      }
      .fgrid a:not(.logo) {

      }
      .fgrid p {
        color: var(--muted);

        max-width: 34ch;
      }
      .fsoc {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        justify-content: center;
      }
      .fsoc a {
        display: grid !important;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0 !important;
        border: 1px solid var(--line);
        border-radius: 50%;
      }
      .fsoc svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .fbot a {
        color: var(--mint-text);
        font-weight: 700;
      }
      .fbot a:hover {
        text-decoration: underline;
      }
      .fbot {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 760px) {
        .fgrid {
          grid-template-columns: 1fr;
        }
      }
      #svcGrid {
        grid-template-columns: 1fr;
      }
      .svb {
        padding: 24px 0 20px;
        overflow: hidden;
      }
      .svh {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 0 24px 18px;
      }
      .svh .ic {
        font-size: 2.2rem;
      }
      .svh h3 {
        margin-bottom: 4px;
      }
      .svh p {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .sld {
        overflow: hidden;
        direction: ltr;
      }
      .strk {
        display: flex;
        width: max-content;
        animation: sl 30s linear infinite;
      }
      .sld:hover .strk {
        animation-play-state: paused;
      }
      .tile {
        flex: none;
        width: 200px;
        height: 130px;
        margin-right: 12px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 2.2rem;
        overflow: hidden;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @keyframes sl {
        to {
          transform: translateX(-50%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .strk {
          animation: none;
        }
        .sld {
          overflow-x: auto;
        }
      }
      .vis {
        text-align: center;
        padding: 40px 24px;
        border-color: var(--mint);
      }
      .vis p {
        font-size: 1.15rem;
        max-width: 60ch;
        margin: 8px auto 0;
        color: var(--text);
      }
      .rv {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stars {
        color: var(--mint-text);
        letter-spacing: 3px;
        direction: ltr;
        text-align: start;
      }
      .rv blockquote {
        margin: 0;

      }

      }

        from {

          transform: translateY(8px);

        }

        font-size: 0.9rem;
        cursor: pointer;
      }

        background: var(--mint);
        color: var(--on-mint);
        border-color: var(--mint);
      }
      .chip input:focus-visible + span {
        outline: 3px solid var(--mint);
        outline-offset: 2px;
      }

        inset: 0;

        place-items: center;

      }

        justify-content: space-between;
        align-items: center;

          return `<article class="card svb"><div class="svh"><div class="ic">${s.i}</div><div><h3>${s[lang][0]}</h3><p>${s[lang][1]}</p></div></div><div class="sld"><div class="strk">${tl}${tl}</div></div></article>`;
        }).join("");
        $("#stats").innerHTML = $("#stats2").innerHTML = CONFIG.stats
          .map((x) => `<div><b>${x.n}</b><small>${x[lang]}</small></div>`)
          .join("");
        $("#revGrid").innerHTML = REVIEWS.map(
          (v) =>
            `<figure class="card rv"><blockquote>${v[lang]}</blockquote><figcaption><b>${v.n[lang]}</b><small>${v.r[lang]}</small></figcaption></figure>`,
        ).join("");
        $("#links").innerHTML =
          `<a href="mailto:${CONFIG.email}">${IC("mail")}${CONFIG.email}</a><a href="tel:${CONFIG.phone.replace(/\s/g, "")}">${IC("phone")}${CONFIG.phone}</a><a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">${IC("whatsapp")}WhatsApp</a><a href="${CONFIG.instagram}" target="_blank" rel="noopener">${IC("instagram")}${CONFIG.instagramName}</a><a href="${CONFIG.github}" target="_blank" rel="noopener">${IC("github")}GitHub</a><a href="${CONFIG.linkedin}" target="_blank" rel="noopener">${IC("linkedin")}LinkedIn</a>`;
        $("#ftNav").innerHTML = IDS.map(
          (id) => `<a href="#/${id}">${t[id]}</a>`,
        ).join("");
        $("#ftCt").innerHTML =
          `<a href="mailto:${CONFIG.email}">${CONFIG.email}</a><a href="tel:${CONFIG.phone.replace(/\s/g, "")}" style="direction:ltr">${CONFIG.phone}</a>`;
        $("#ftSoc").innerHTML = [
          [CONFIG.github, "github", "GitHub"],
          [CONFIG.linkedin, "linkedin", "LinkedIn"],
          [CONFIG.instagram, "instagram", "Instagram"],
          ["https://wa.me/" + CONFIG.whatsapp, "whatsapp", "WhatsApp"],
        ]
          .map(
            (x) =>
              `<a href="${x[0]}" target="_blank" rel="noopener" aria-label="${x[2]}">${IC(x[1])}</a>`,
          )
          .join("");
        $("#ftWa").href = "https://wa.me/" + CONFIG.whatsapp;
        $("#waBtn").href = $("#waCta").href =
          "https://wa.me/" + CONFIG.whatsapp;
        $("#igCta").href = CONFIG.instagram;
        $("#abtGrid").innerHTML = [1, 2, 3]
          .map(
            (i) =>
              `<div class="card"><h3>${t["q" + i]}</h3><p>${t["a" + i]}</p></div>`,
          )
          .join("");
        $("#featGrid").innerHTML = CONFIG.projects
          .slice(0, 3)
          .map((p) => card(p, 1))
          .join("");
        $("#techBox").innerHTML = `<div class="tech">${TECH.flatMap(
          (g) => g.items,
        )
          .map((x) => `<span>${x[0]}</span>`)
          .join("")}</div>`;
        $("#soc").innerHTML =
          `<a href="${CONFIG.github}" target="_blank" rel="noopener">${IC("github")}GitHub</a><a href="${CONFIG.linkedin}" target="_blank" rel="noopener">${IC("linkedin")}LinkedIn</a><a href="${CONFIG.instagram}" target="_blank" rel="noopener">${IC("instagram")}Instagram</a><a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener" aria-label="WhatsApp">${IC("whatsapp")}WhatsApp</a>`;
        $("#waCta").insertAdjacentHTML("afterbegin", IC("whatsapp"));
        $("#igCta").innerHTML = IC("instagram") + "Instagram";
        if (CONFIG.photo) {
          $("#photo").src = CONFIG.photo;
          $("#photo").hidden = false;
          $("#codeArt").hidden = true;
        }
        observe();
      }
      function observe() {
        const io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              if (e.isIntersecting) {
                e.target.style.width = e.target.dataset.w + "%";
                io.unobserve(e.target);
              }
            }),
          { threshold: 0.4 },
        );
        document.querySelectorAll(".fill").forEach((f) => io.observe(f));
      }
      let cur = "home";
      function route() {
        go(cur);
      }
      function go(id, push) {
        if (!IDS.includes(id)) id = "home";
        cur = id;
        document.body.dataset.pg = id;
        if (push) {
          try {
            history.replaceState(null, "", "#/" + id);
          } catch (x) {}
        }
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.toggle("show", p.id === "p-" + id));
        document
          .querySelectorAll("nav a")
          .forEach((a) => a.classList.toggle("on", a.dataset.id === id));
        $("#nav").classList.remove("open");
        window.scrollTo(0, 0);
      }
      window.addEventListener("hashchange", () =>
        go(location.hash.replace("#/", "")),
      );
      const modal = $("#modal");
      document.addEventListener("click", (e) => {
        const a = e.target.closest('a[href^="#/"]');
        if (a) {
          e.preventDefault();
          go(a.getAttribute("href").slice(2), true);
          return;
        }
        if (e.target.closest("[data-open]")) {
          modal.hidden = false;
          $("#nav").classList.remove("open");
        } else if (e.target.closest("[data-close]") || e.target === modal)
          modal.hidden = true;
        else if (e.target.closest("#burger"))
          $("#nav").classList.toggle("open");
        else if (e.target.closest(".lg")) {
          lang = lang === "ar" ? "en" : "ar";
          try {
            localStorage.setItem("lang", lang);
          } catch (x) {}
          render();
          route();
        } else if (e.target.closest(".th")) {
          const d = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = d;
          try {
            localStorage.setItem("theme", d);
          } catch (x) {}
          render();
          route();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") modal.hidden = true;
      });
      function reqText() {
        const t = T[lang];
        return `*${t.reqTitle}*\n${t.name}: ${$("#rn").value}\n${t.tel}: ${$("#rp").value}\n${t.mail}: ${$("#re").value}\n${t.svc}: ${SERVICES[$("#rs").value][lang][0]}\n${t.det}: ${$("#rm").value}`;
      }
      $("#rform").onsubmit = (e) => {
        e.preventDefault();
        window.open(
          "https://wa.me/" +
            CONFIG.whatsapp +
            "?text=" +
            encodeURIComponent(reqText()),
          "_blank",
        );
      };
      $("#form").onsubmit = (e) => {
        e.preventDefault();
        const m = T[lang].waMsg + $("#fn").value + "\n" + $("#fm").value;
        window.open(
          "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(m),
          "_blank",
        );
      };
      $("#yr").textContent = new Date().getFullYear();
      render();
      go((location.hash || "").replace("#/", ""));
    </script>
  </body>
</html>
